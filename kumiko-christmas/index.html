<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="久美子的 3D 星河圣诞树，用照片、星尘、雪光和流动灯带收藏节日回忆。">
    <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"%3E%3Cpath fill="%23f4d478" d="M16 3 20 12 30 13 22 19 25 29 16 24 7 29 10 19 2 13 12 12Z"/%3E%3C/svg%3E'>
    <link rel="modulepreload" href="./vendor/three/build/three.module.js">
    <link rel="modulepreload" href="./vendor/three/examples/jsm/controls/OrbitControls.js">
    <link rel="modulepreload" href="./vendor/three/examples/jsm/postprocessing/EffectComposer.js">
    <link rel="modulepreload" href="./vendor/three/examples/jsm/postprocessing/RenderPass.js">
    <link rel="modulepreload" href="./vendor/three/examples/jsm/postprocessing/UnrealBloomPass.js">
    <link rel="modulepreload" href="./vendor/three/examples/jsm/environments/RoomEnvironment.js">
    <title>久美子的星河圣诞树</title>
    <style>
        :root {
            color-scheme: dark;
            --gold: #f4d478;
            --green: #0f3c26;
            --red: #a73339;
            --blue: #8db7ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: #02030a;
            color: #fff7cf;
            font-family: "Times New Roman", "Noto Serif SC", serif;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: grid;
            place-items: center;
            background: #02030a;
            transition: opacity 0.7s ease;
        }

        .loader-inner {
            display: grid;
            justify-items: center;
            gap: 18px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 1px solid rgba(244, 212, 120, 0.22);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            color: rgba(244, 212, 120, 0.86);
            font-size: 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(24px, 5vh, 54px) 18px;
        }

        h1 {
            margin: 0;
            max-width: min(940px, 96vw);
            color: #fff4ba;
            font-size: clamp(34px, 6vw, 74px);
            font-weight: 400;
            line-height: 1.05;
            text-align: center;
            text-shadow:
                0 0 24px rgba(244, 212, 120, 0.45),
                0 0 64px rgba(74, 126, 255, 0.22);
        }

        .subtitle {
            margin: 10px 0 0;
            max-width: min(620px, calc(100vw - 36px));
            color: rgba(255, 247, 207, 0.78);
            font: 14px/1.65 "Segoe UI", "Microsoft YaHei", sans-serif;
            text-align: center;
            text-shadow: 0 0 18px rgba(74, 126, 255, 0.2);
        }

        .counter {
            margin-top: 12px;
            min-width: 112px;
            border: 1px solid rgba(244, 212, 120, 0.26);
            background: rgba(2, 3, 10, 0.5);
            color: rgba(255, 246, 203, 0.86);
            padding: 8px 12px;
            font: 12px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
            text-align: center;
            letter-spacing: 0.08em;
            backdrop-filter: blur(10px);
        }

        .action-row {
            margin-top: auto;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        button,
        .upload-btn {
            min-height: 42px;
            border: 1px solid rgba(244, 212, 120, 0.34);
            background: rgba(2, 3, 10, 0.58);
            color: #f4d478;
            padding: 0 14px;
            font: 13px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        button.is-playing {
            color: #fff4ba;
            background: rgba(244, 212, 120, 0.2);
            border-color: rgba(244, 212, 120, 0.78);
            box-shadow: 0 0 18px rgba(244, 212, 120, 0.18);
        }

        button {
            display: flex;
        }

        .upload-btn {
            display: inline-flex;
        }

        button:hover,
        .upload-btn:hover {
            background: rgba(244, 212, 120, 0.15);
            border-color: rgba(244, 212, 120, 0.68);
        }

        button:active,
        .upload-btn:active {
            transform: translateY(1px);
        }

        #file-input {
            display: none;
        }

        @media (max-width: 640px) {
            #ui-layer {
                padding-top: 22px;
                padding-bottom: 20px;
            }

            .action-row {
                position: absolute;
                left: 50%;
                right: auto;
                bottom: 20px;
                width: min(330px, calc(100vw - 36px));
                transform: translateX(-50%);
                justify-content: center;
                gap: 6px;
            }

            button,
            .upload-btn {
                min-width: 0;
                flex: 1 1 0;
                max-width: none;
                padding: 0 6px;
                font-size: 12px;
            }

            .subtitle {
                margin-top: 8px;
                font-size: 12px;
                line-height: 1.55;
            }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/build/three.module.js",
                "three/addons/": "./vendor/three/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loader" aria-live="polite">
        <div class="loader-inner">
            <div class="spinner"></div>
            <div id="loader-text" class="loader-text">Loading Memories</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <h1>久美子的星河圣诞树</h1>
        <p class="subtitle">把每一张回忆挂进星河，等雪光慢慢亮起来。</p>
        <div id="image-count" class="counter">0 / 0</div>
        <div class="action-row">
            <button id="music-toggle" type="button" aria-label="播放 愛を見つけた場所" title="愛を見つけた場所">音乐</button>
            <button id="focus-next" type="button">聚焦照片</button>
            <button id="clear-focus" type="button">全景</button>
            <label class="upload-btn">
                加照片
                <input type="file" id="file-input" multiple accept="image/*">
            </label>
        </div>
    </div>

    <audio id="bg-music" preload="none" loop>
        <source src="./assets/music/ai-wo-mitsuketa-basho.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
        import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
        import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
        import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

        const DEVICE = {
            compact: Math.min(window.innerWidth, window.innerHeight) <= 680 || (navigator.deviceMemory && navigator.deviceMemory <= 4),
            reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches
        };

        const CONFIG = {
            colors: {
                bg: 0x02030a,
                gold: 0xf4d478,
                green: 0x0f3c26,
                red: 0xa73339,
                blue: 0x8db7ff,
                violet: 0xb997ff
            },
            tree: {
                count: DEVICE.reducedMotion ? 850 : (DEVICE.compact ? 1180 : 1780),
                height: 24,
                radius: 8,
                garlandCount: DEVICE.compact ? 4 : 5,
                garlandSegments: DEVICE.compact ? 72 : 104,
                lightCount: DEVICE.reducedMotion ? 80 : (DEVICE.compact ? 120 : 172)
            },
            galaxy: {
                dustCount: DEVICE.reducedMotion ? 1800 : (DEVICE.compact ? 2800 : 4200),
                starCount: DEVICE.reducedMotion ? 1200 : (DEVICE.compact ? 1800 : 2600)
            },
            camera: {
                z: 48
            },
            photos: {
                concurrentLoads: 1,
                textureSize: DEVICE.compact ? 288 : 384,
                focusTextureSize: DEVICE.compact ? 512 : 768,
                loadPauseMs: DEVICE.compact ? 110 : 70,
                musicHoldMs: 2600
            },
            render: {
                pixelRatio: DEVICE.compact ? 1.15 : 1.5,
                snowCount: DEVICE.reducedMotion ? 360 : (DEVICE.compact ? 620 : 900),
                treeRotationSpeed: DEVICE.reducedMotion ? 0.03 : 0.085
            }
        };

        const STATE = {
            focusIndex: -1,
            focusTarget: null,
            loaded: 0,
            total: 0,
            musicReady: false,
            musicHoldUntil: 0
        };

        let scene;
        let camera;
        let renderer;
        let composer;
        let controls;
        let mainGroup;
        let galaxyDust;
        let snowSystem;
        let caneTexture;
        let garlandGroup = new THREE.Group();
        let treeLightGroup = new THREE.Group();
        let heroStar;
        let heroStarLight;
        let clock = new THREE.Clock();
        let particleSystem = [];
        let photoParticles = [];
        let photoMeshGroup = new THREE.Group();
        let resizeFrame = 0;
        let isPageVisible = !document.hidden;

        const shared = {};
        const scratch = {
            focusWorld: new THREE.Vector3(0, 2.4, 29),
            focusLocal: new THREE.Vector3(),
            inverseMain: new THREE.Matrix4()
        };
        const counterEl = document.getElementById("image-count");
        const loaderTextEl = document.getElementById("loader-text");
        const musicToggleEl = document.getElementById("music-toggle");
        const musicAudioEl = document.getElementById("bg-music");

        async function init() {
            initThree();
            setupEnvironment();
            setupLights();
            createTextures();
            createSharedPhotoAssets();
            createTreeParticles();
            createTreeGarlands();
            createTreeLights();
            createGalaxyDust();
            createStarfield();
            createSnow();
            setupPostProcessing();
            setupEvents();
            hideLoader();
            animate();
            loadBuiltInPhotos().catch((error) => {
                console.error("Failed to load built-in photos", error);
                if (STATE.total === 0) {
                    addPlaceholderPhoto();
                    updateCounter(1, 1);
                }
            });
        }

        function initThree() {
            const container = document.getElementById("canvas-container");
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.bg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.0065);

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, CONFIG.camera.z);

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.render.pixelRatio));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.18;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enablePan = false;
            controls.minDistance = 22;
            controls.maxDistance = 76;
            controls.target.set(0, 2, 0);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);
            mainGroup.add(garlandGroup);
            mainGroup.add(treeLightGroup);
            mainGroup.add(photoMeshGroup);
        }

        function setupEnvironment() {
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.56));

            const gold = new THREE.SpotLight(0xffcc66, 900);
            gold.position.set(28, 42, 42);
            gold.angle = 0.52;
            gold.penumbra = 0.55;
            scene.add(gold);

            const blue = new THREE.SpotLight(0x7aa5ff, 760);
            blue.position.set(-36, 18, -30);
            blue.angle = 0.7;
            scene.add(blue);

            const rim = new THREE.DirectionalLight(0xfff1bd, 0.85);
            rim.position.set(0, 8, 48);
            scene.add(rim);
        }

        function setupPostProcessing() {
            const renderScene = new RenderPass(scene, camera);
            const bloom = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.25,
                0.42,
                0.76
            );
            bloom.threshold = 0.76;
            bloom.strength = 0.45;
            bloom.radius = 0.52;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloom);
        }

        function createTextures() {
            const canvas = document.createElement("canvas");
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#fff7e2";
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = "#a21f2c";
            ctx.beginPath();
            for (let i = -128; i < 256; i += 32) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i + 32, 128);
                ctx.lineTo(i + 16, 128);
                ctx.lineTo(i - 16, 0);
            }
            ctx.fill();

            caneTexture = new THREE.CanvasTexture(canvas);
            caneTexture.wrapS = THREE.RepeatWrapping;
            caneTexture.wrapT = THREE.RepeatWrapping;
            caneTexture.repeat.set(3, 3);
        }

        function createSharedPhotoAssets() {
            shared.frameGeo = new THREE.BoxGeometry(1.5, 1.5, 0.06);
            shared.photoGeo = new THREE.PlaneGeometry(1.25, 1.25);
            shared.hookGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.48, 8);
            shared.beadGeo = new THREE.SphereGeometry(0.07, 12, 12);
            shared.frameMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.gold,
                metalness: 1,
                roughness: 0.45,
                emissive: 0x3b2600,
                emissiveIntensity: 0.22
            });
            shared.hookMat = new THREE.MeshStandardMaterial({
                color: 0xffe7a1,
                metalness: 1,
                roughness: 0.28,
                emissive: 0x4a3100,
                emissiveIntensity: 0.25
            });
        }

        class Particle {
            constructor(mesh, type, options = {}) {
                this.mesh = mesh;
                this.type = type;
                this.isDust = Boolean(options.isDust);
                this.index = options.index || 0;
                this.total = options.total || 1;
                this.baseScale = mesh.scale.x || 1;
                this.posTree = new THREE.Vector3();
                this.posScatter = new THREE.Vector3();
                this.dynamicTarget = new THREE.Vector3();
                this.spinSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 1.8,
                    (Math.random() - 0.5) * 1.8,
                    (Math.random() - 0.5) * 1.8
                );
                this.scaleTarget = new THREE.Vector3(this.baseScale, this.baseScale, this.baseScale);
                this.twinklePhase = Math.random() * Math.PI * 2;
                this.twinkleSpeed = 0.55 + Math.random() * 0.75;
                this.twinklePower = type === "BOX" ? 0.035 : 0.075;
                this.floatPower = type === "BOX" ? 0.035 : 0.07;
                this.orbit = {
                    radius: 12,
                    y: 0,
                    angle: 0,
                    speed: 0.04,
                    phase: Math.random() * Math.PI * 2
                };
                this.calculatePositions();
            }

            calculatePositions() {
                if (this.type === "PHOTO") {
                    const total = Math.max(1, this.total);
                    const progress = (this.index + 0.5) / total;
                    const goldenAngle = 2.399963229728653;
                    const armTwist = (this.index % 6) * Math.PI / 3;
                    this.orbit.radius = 16 + Math.sqrt(progress) * 45 + ((this.index % 4) - 1.5) * 1.1;
                    this.orbit.y = Math.sin(this.index * 0.58) * 3 + (progress - 0.5) * 8 - 5;
                    this.orbit.angle = this.index * goldenAngle + armTwist * 0.22;
                    this.orbit.speed = 0.035 + (this.index % 9) * 0.0035;
                    this.orbit.phase = this.index * 0.47;
                    return;
                }

                const h = CONFIG.tree.height;
                const halfH = h / 2;
                let t = Math.pow(Math.random(), 0.72);
                const y = (t * h) - halfH;
                let rMax = CONFIG.tree.radius * Math.pow(1 - t, 0.92);
                if (rMax < 0.5) rMax = 0.5;
                const branchTier = 1 + Math.sin(t * Math.PI * 10) * 0.07;
                const outerBias = Math.random() < 0.68 ? 0.48 + Math.random() * 0.48 : 0.92 + Math.random() * 0.26;
                const angle = t * 58 * Math.PI + Math.random() * 0.9;
                const r = rMax * outerBias * branchTier;
                this.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);

                const rScatter = this.isDust ? 18 + Math.random() * 24 : 8 + Math.random() * 12;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(
                    rScatter * Math.sin(phi) * Math.cos(theta),
                    rScatter * Math.sin(phi) * Math.sin(theta),
                    rScatter * Math.cos(phi)
                );
            }

            update(dt) {
                let target = this.posTree;
                let scale = this.baseScale;
                const time = clock.elapsedTime;

                if (this.type === "PHOTO") {
                    const angle = this.orbit.angle + time * this.orbit.speed;
                    const wave = Math.sin(time * 0.58 + this.orbit.phase);
                    const radius = this.orbit.radius + Math.sin(time * 0.22 + this.orbit.phase) * 1.1;
                    target = this.dynamicTarget.set(
                        Math.cos(angle) * radius,
                        this.orbit.y + Math.sin(angle * 0.72 + this.orbit.phase) * radius * 0.1 + wave * 0.72,
                        Math.sin(angle) * radius * 0.52
                    );

                    if (STATE.focusTarget === this.mesh) {
                        scratch.inverseMain.copy(mainGroup.matrixWorld).invert();
                        target = scratch.focusLocal.copy(scratch.focusWorld).applyMatrix4(scratch.inverseMain);
                        scale = this.baseScale * 3.25;
                    } else if (STATE.focusTarget) {
                        scale = this.baseScale * 0.72;
                    } else {
                        scale = this.baseScale * (1 + Math.sin(time * 0.6 + this.orbit.phase) * 0.055);
                    }

                    this.mesh.position.lerp(target, dt * 2.2);
                    this.mesh.lookAt(camera.position);
                    this.mesh.rotateZ(Math.sin(time * 0.45 + this.orbit.phase) * 0.035);
                    this.mesh.scale.lerp(this.scaleTarget.setScalar(scale), dt * 4);
                    return;
                }

                const flicker = Math.sin(time * this.twinkleSpeed + this.twinklePhase);
                target = this.dynamicTarget.copy(this.posTree);
                target.y += flicker * this.floatPower;
                target.x += Math.sin(time * 0.24 + this.twinklePhase) * this.floatPower * 0.35;
                scale = this.baseScale * (1 + flicker * this.twinklePower);

                this.mesh.position.lerp(target, dt * 2.0);
                this.mesh.rotation.x += this.spinSpeed.x * dt * 0.22;
                this.mesh.rotation.y += (0.34 + this.spinSpeed.y * 0.2) * dt;
                this.mesh.rotation.z += this.spinSpeed.z * dt * 0.12;
                this.mesh.scale.lerp(this.scaleTarget.setScalar(scale), dt * 4);
            }
        }

        function createTreeParticles() {
            const sphereGeo = new THREE.SphereGeometry(0.5, 24, 24);
            const boxGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -0.5, 0),
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.1, 0.5, 0),
                new THREE.Vector3(0.3, 0.4, 0)
            ]);
            const candyGeo = new THREE.TubeGeometry(curve, 16, 0.08, 8, false);

            const greenMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.green,
                metalness: 0.25,
                roughness: 0.78,
                emissive: 0x052f16,
                emissiveIntensity: 0.35
            });
            const goldMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.gold,
                metalness: 1,
                roughness: 0.35,
                emissive: 0x503500,
                emissiveIntensity: 0.2
            });
            const redMat = new THREE.MeshPhysicalMaterial({
                color: CONFIG.colors.red,
                metalness: 0.35,
                roughness: 0.22,
                clearcoat: 1,
                emissive: 0x3f0609,
                emissiveIntensity: 0.12
            });
            const candyMat = new THREE.MeshStandardMaterial({
                map: caneTexture,
                roughness: 0.38
            });

            for (let i = 0; i < CONFIG.tree.count; i++) {
                const rand = Math.random();
                let mesh;
                let type;

                if (rand < 0.42) {
                    mesh = new THREE.Mesh(boxGeo, greenMat);
                    type = "BOX";
                } else if (rand < 0.7) {
                    mesh = new THREE.Mesh(boxGeo, goldMat);
                    type = "GOLD_BOX";
                } else if (rand < 0.91) {
                    mesh = new THREE.Mesh(sphereGeo, goldMat);
                    type = "GOLD_SPHERE";
                } else if (rand < 0.97) {
                    mesh = new THREE.Mesh(sphereGeo, redMat);
                    type = "RED";
                } else {
                    mesh = new THREE.Mesh(candyGeo, candyMat);
                    type = "CANE";
                }

                const s = 0.36 + Math.random() * 0.52;
                mesh.scale.set(s, s, s);
                mesh.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
                mainGroup.add(mesh);
                particleSystem.push(new Particle(mesh, type));
            }

            const starGeo = new THREE.OctahedronGeometry(1.28, 0);
            const starMat = new THREE.MeshStandardMaterial({
                color: 0xffe6a3,
                emissive: 0xffaa00,
                emissiveIntensity: 2.2,
                metalness: 1,
                roughness: 0
            });
            const star = new THREE.Mesh(starGeo, starMat);
            const halo = new THREE.Mesh(
                new THREE.OctahedronGeometry(1.95, 0),
                new THREE.MeshBasicMaterial({
                    color: 0xffd36a,
                    transparent: true,
                    opacity: 0.2,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                })
            );
            heroStarLight = new THREE.PointLight(0xffd36a, 2.4, 18);
            heroStar = new THREE.Group();
            heroStar.add(star, halo, heroStarLight);
            heroStar.position.set(0, CONFIG.tree.height / 2 + 1.25, 0);
            heroStar.userData.halo = halo;
            mainGroup.add(heroStar);
        }

        function createTreeGarlands() {
            const colors = [CONFIG.colors.gold, CONFIG.colors.red, CONFIG.colors.blue, CONFIG.colors.violet];
            const h = CONFIG.tree.height;
            const halfH = h / 2;

            for (let band = 0; band < CONFIG.tree.garlandCount; band++) {
                const points = [];
                const start = 0.12 + band * 0.035;
                const end = 0.9 - band * 0.018;
                const turns = 1.35 + band * 0.12;

                for (let i = 0; i <= CONFIG.tree.garlandSegments; i++) {
                    const progress = i / CONFIG.tree.garlandSegments;
                    const t = start + (end - start) * progress;
                    const radius = CONFIG.tree.radius * Math.pow(1 - t, 0.92) * 1.06 + 0.08;
                    const angle = (progress * turns + band * 0.24) * Math.PI * 2 + t * Math.PI * 1.4;
                    points.push(new THREE.Vector3(
                        Math.cos(angle) * radius,
                        t * h - halfH,
                        Math.sin(angle) * radius
                    ));
                }

                const curve = new THREE.CatmullRomCurve3(points);
                const geo = new THREE.TubeGeometry(curve, CONFIG.tree.garlandSegments, DEVICE.compact ? 0.026 : 0.034, 6, false);
                const mat = new THREE.MeshBasicMaterial({
                    color: colors[band % colors.length],
                    transparent: true,
                    opacity: 0.54,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                const ribbon = new THREE.Mesh(geo, mat);
                ribbon.userData.phase = band * 0.9;
                garlandGroup.add(ribbon);
            }
        }

        function createTreeLights() {
            const bulbGeo = new THREE.SphereGeometry(0.115, 12, 12);
            const palette = [0xfff0aa, 0xff646f, 0x8db7ff, 0xf4d478];
            const materials = palette.map((color) => new THREE.MeshStandardMaterial({
                color,
                emissive: color,
                emissiveIntensity: 1.35,
                roughness: 0.18,
                metalness: 0.15
            }));
            const h = CONFIG.tree.height;
            const halfH = h / 2;

            for (let i = 0; i < CONFIG.tree.lightCount; i++) {
                const progress = i / Math.max(1, CONFIG.tree.lightCount - 1);
                const t = 0.08 + progress * 0.84;
                const radius = CONFIG.tree.radius * Math.pow(1 - t, 0.92) * (1.01 + Math.sin(i * 1.7) * 0.035);
                const angle = t * 56 * Math.PI + i * 0.42;
                const bulb = new THREE.Mesh(bulbGeo, materials[i % materials.length]);
                const scale = 0.72 + (i % 5) * 0.07;
                bulb.position.set(
                    Math.cos(angle) * radius,
                    t * h - halfH,
                    Math.sin(angle) * radius
                );
                bulb.scale.setScalar(scale);
                bulb.userData.baseScale = scale;
                bulb.userData.phase = i * 0.37;
                treeLightGroup.add(bulb);
            }
        }

        function createGalaxyDust() {
            const positions = [];
            const colors = [];
            const color = new THREE.Color();

            for (let i = 0; i < CONFIG.galaxy.dustCount; i++) {
                const arm = i % 5;
                const progress = i / CONFIG.galaxy.dustCount;
                const radius = 8 + Math.pow(progress, 0.62) * 38 + Math.random() * 2;
                const angle = progress * Math.PI * 18 + arm * Math.PI * 0.4 + Math.random() * 0.45;
                const y = Math.sin(angle * 0.9) * 3 + (Math.random() - 0.5) * 5;

                positions.push(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                );

                color.set(i % 3 === 0 ? CONFIG.colors.gold : (i % 3 === 1 ? CONFIG.colors.blue : CONFIG.colors.violet));
                colors.push(color.r, color.g, color.b);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.09,
                vertexColors: true,
                transparent: true,
                opacity: 0.72,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            galaxyDust = new THREE.Points(geo, mat);
            mainGroup.add(galaxyDust);
        }

        function createStarfield() {
            const positions = [];
            for (let i = 0; i < CONFIG.galaxy.starCount; i++) {
                const radius = 70 + Math.random() * 170;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions.push(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xd8e7ff,
                size: 0.24,
                transparent: true,
                opacity: 0.68,
                depthWrite: false
            });
            scene.add(new THREE.Points(geo, mat));
        }

        function createSnow() {
            const positions = [];
            const velocities = [];
            for (let i = 0; i < CONFIG.render.snowCount; i++) {
                positions.push(
                    (Math.random() - 0.5) * 112,
                    (Math.random() - 0.5) * 86 + 14,
                    (Math.random() - 0.5) * 112
                );
                velocities.push(Math.random() * 0.1 + 0.045);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute("velocity", new THREE.Float32BufferAttribute(velocities, 1));

            const canvas = document.createElement("canvas");
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext("2d");
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, "rgba(255,255,255,1)");
            grad.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);

            const mat = new THREE.PointsMaterial({
                color: 0xffffff,
                map: new THREE.CanvasTexture(canvas),
                size: 0.38,
                transparent: true,
                opacity: 0.38,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            snowSystem = new THREE.Points(geo, mat);
            scene.add(snowSystem);
        }

        async function loadBuiltInPhotos() {
            let manifest = [];
            try {
                const response = await fetch("./photos.json");
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                manifest = await response.json();
            } catch (error) {
                console.error("Failed to load photos.json", error);
            }

            if (!Array.isArray(manifest) || manifest.length === 0) {
                addPlaceholderPhoto();
                updateCounter(1, 1);
                return;
            }

            STATE.total = manifest.length;
            updateCounter(0, manifest.length);

            const queue = manifest.map((item, index) => ({ item, index }));
            const workers = Array.from({ length: Math.min(CONFIG.photos.concurrentLoads, queue.length) }, async () => {
                while (queue.length > 0) {
                    const next = queue.shift();
                    try {
                        await waitForAudioPriority();
                        await waitForIdleSlot();
                        const texture = await createPhotoTexture(next.item.src);
                        addPhotoToScene(texture, next.item.name, next.index, manifest.length, next.item.fullSrc);
                    } catch (error) {
                        console.warn("Skipped photo", next.item.src, error);
                    } finally {
                        STATE.loaded += 1;
                        updateCounter(STATE.loaded, manifest.length);
                    }
                    await waitForFrameBudget();
                }
            });

            await Promise.all(workers);
        }

        async function createPhotoTexture(src, targetSize = CONFIG.photos.textureSize) {
            const img = await loadImage(src);
            const size = Math.min(img.naturalWidth || img.width, img.naturalHeight || img.height);
            const sx = ((img.naturalWidth || img.width) - size) / 2;
            const sy = ((img.naturalHeight || img.height) - size) / 2;
            const canvas = document.createElement("canvas");
            const textureSize = targetSize;
            canvas.width = textureSize;
            canvas.height = textureSize;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#050712";
            ctx.fillRect(0, 0, textureSize, textureSize);
            ctx.drawImage(img, sx, sy, size, size, 0, 0, textureSize, textureSize);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            return texture;
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.decoding = "async";
                img.src = src;
            });
        }

        function waitForNextFrame() {
            return new Promise((resolve) => requestAnimationFrame(resolve));
        }

        function waitForIdleSlot() {
            if ("requestIdleCallback" in window) {
                return new Promise((resolve) => {
                    window.requestIdleCallback(resolve, { timeout: 700 });
                });
            }
            return waitForNextFrame();
        }

        async function waitForFrameBudget() {
            await waitForNextFrame();
            if (DEVICE.compact || STATE.musicReady) {
                await waitForIdleSlot();
            }
            const pause = STATE.musicReady ? CONFIG.photos.loadPauseMs * 1.8 : CONFIG.photos.loadPauseMs;
            await sleep(pause);
        }

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        async function waitForAudioPriority() {
            const remaining = STATE.musicHoldUntil - performance.now();
            if (remaining > 0) {
                await sleep(Math.min(remaining, CONFIG.photos.musicHoldMs));
            }
        }

        function addPhotoToScene(texture, label, index, total, fullSrc = "") {
            const frame = new THREE.Mesh(shared.frameGeo, shared.frameMat);
            const photoMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                color: 0xffffff,
                side: THREE.DoubleSide
            });
            const photo = new THREE.Mesh(
                shared.photoGeo,
                photoMaterial
            );
            photo.position.z = 0.045;

            const hook = new THREE.Mesh(shared.hookGeo, shared.hookMat);
            hook.position.y = 0.96;
            hook.rotation.z = Math.PI / 2;

            const bead = new THREE.Mesh(shared.beadGeo, shared.hookMat);
            bead.position.y = 1.2;

            const group = new THREE.Group();
            group.userData.label = label || "";
            group.userData.fullSrc = fullSrc || "";
            group.userData.photoMaterial = photoMaterial;
            group.userData.highResLoaded = false;
            group.userData.highResLoading = false;
            group.add(frame, photo, hook, bead);
            group.scale.setScalar(0.66);

            photoMeshGroup.add(group);
            const particle = new Particle(group, "PHOTO", { index, total });
            placePhotoOnOrbit(particle);
            photoParticles.push(particle);
            particleSystem.push(particle);
        }

        function placePhotoOnOrbit(particle) {
            const angle = particle.orbit.angle;
            const radius = particle.orbit.radius;
            particle.mesh.position.set(
                Math.cos(angle) * radius,
                particle.orbit.y + Math.sin(angle * 0.72 + particle.orbit.phase) * radius * 0.1,
                Math.sin(angle) * radius * 0.52
            );
        }

        function addPlaceholderPhoto() {
            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#050712";
            ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = "#f4d478";
            ctx.lineWidth = 18;
            ctx.strokeRect(28, 28, 456, 456);
            ctx.font = "600 54px serif";
            ctx.textAlign = "center";
            ctx.fillStyle = "#f4d478";
            ctx.fillText("Merry", 256, 238);
            ctx.fillText("Christmas", 256, 306);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            addPhotoToScene(texture, "Merry Christmas", 0, 1);
        }

        function clearPhotos() {
            for (const child of [...photoMeshGroup.children]) {
                photoMeshGroup.remove(child);
                child.traverse((node) => {
                    if (!node.isMesh) return;
                    if (node.material && node.material.map) node.material.map.dispose();
                    if (node.material && node.material !== shared.frameMat && node.material !== shared.hookMat) {
                        node.material.dispose();
                    }
                });
            }

            particleSystem = particleSystem.filter((particle) => particle.type !== "PHOTO");
            photoParticles = [];
            STATE.focusIndex = -1;
            STATE.focusTarget = null;
            STATE.loaded = 0;
            STATE.total = 0;
        }

        async function handleImageUpload(event) {
            const files = Array.from(event.target.files || []).filter((file) => file.type.startsWith("image/"));
            if (files.length === 0) return;

            clearPhotos();
            STATE.total = files.length;
            updateCounter(0, files.length);

            for (let i = 0; i < files.length; i++) {
                const dataUrl = await readFileAsDataURL(files[i]);
                const texture = await createPhotoTexture(dataUrl);
                addPhotoToScene(texture, files[i].name.replace(/\.[^.]+$/, ""), i, files.length);
                STATE.loaded = i + 1;
                updateCounter(STATE.loaded, files.length);
            }
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function focusNextPhoto() {
            if (photoParticles.length === 0) return;
            STATE.focusIndex = (STATE.focusIndex + 1) % photoParticles.length;
            STATE.focusTarget = photoParticles[STATE.focusIndex].mesh;
            upgradeFocusedPhoto(STATE.focusTarget);
        }

        async function upgradeFocusedPhoto(group) {
            if (!group || !group.userData.fullSrc || group.userData.highResLoaded || group.userData.highResLoading) return;

            const token = Symbol("photo-load");
            group.userData.highResLoading = true;
            group.userData.loadToken = token;
            try {
                const texture = await createPhotoTexture(group.userData.fullSrc, CONFIG.photos.focusTextureSize);
                if (group.userData.loadToken !== token || !photoMeshGroup.children.includes(group)) {
                    texture.dispose();
                    return;
                }

                const material = group.userData.photoMaterial;
                const previousTexture = material.map;
                material.map = texture;
                material.needsUpdate = true;
                if (previousTexture) previousTexture.dispose();
                group.userData.highResLoaded = true;
            } catch (error) {
                console.warn("Failed to upgrade focused photo", group.userData.fullSrc, error);
            } finally {
                if (group.userData.loadToken === token) {
                    group.userData.highResLoading = false;
                }
            }
        }

        function clearFocus() {
            STATE.focusIndex = -1;
            STATE.focusTarget = null;
        }

        async function toggleMusic() {
            if (!musicAudioEl) return;

            if (musicAudioEl.paused) {
                musicAudioEl.preload = "auto";
                musicAudioEl.volume = 0.86;
                STATE.musicHoldUntil = performance.now() + CONFIG.photos.musicHoldMs;
                try {
                    await musicAudioEl.play();
                    STATE.musicReady = true;
                    updateMusicButton();
                } catch (error) {
                    console.warn("Music playback did not start", error);
                    musicToggleEl.textContent = "重试";
                    musicToggleEl.classList.remove("is-playing");
                }
            } else {
                musicAudioEl.pause();
                updateMusicButton();
            }
        }

        function updateMusicButton() {
            if (!musicAudioEl || !musicToggleEl) return;
            const playing = !musicAudioEl.paused;
            musicToggleEl.textContent = playing ? "暂停" : "音乐";
            musicToggleEl.classList.toggle("is-playing", playing);
            musicToggleEl.setAttribute("aria-label", `${playing ? "暂停" : "播放"} 愛を見つけた場所`);
        }

        function setupEvents() {
            window.addEventListener("resize", () => {
                if (resizeFrame) return;
                resizeFrame = requestAnimationFrame(() => {
                    resizeFrame = 0;
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.render.pixelRatio));
                    composer.setSize(window.innerWidth, window.innerHeight);
                });
            });

            document.addEventListener("visibilitychange", () => {
                isPageVisible = !document.hidden;
                clock.getDelta();
            });

            renderer.domElement.addEventListener("dblclick", focusNextPhoto);
            musicToggleEl.addEventListener("click", toggleMusic);
            musicAudioEl.addEventListener("play", updateMusicButton);
            musicAudioEl.addEventListener("pause", updateMusicButton);
            document.getElementById("focus-next").addEventListener("click", focusNextPhoto);
            document.getElementById("clear-focus").addEventListener("click", clearFocus);
            document.getElementById("file-input").addEventListener("change", handleImageUpload);
        }

        function updateCounter(loaded, total) {
            counterEl.textContent = `${loaded} / ${total}`;
            loaderTextEl.textContent = `载入回忆 ${loaded}/${total}`;
        }

        function hideLoader() {
            const loader = document.getElementById("loader");
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 750);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isPageVisible) return;

            const dt = Math.min(clock.getDelta(), 0.04);
            const elapsed = clock.elapsedTime;

            mainGroup.rotation.y += dt * CONFIG.render.treeRotationSpeed;
            mainGroup.rotation.z = Math.sin(elapsed * 0.18) * 0.014;
            mainGroup.position.y = Math.sin(elapsed * 0.28) * 0.12;

            if (heroStar) {
                const pulse = 1 + Math.sin(elapsed * 2.4) * 0.075;
                heroStar.rotation.y += dt * 0.72;
                heroStar.rotation.z -= dt * 0.36;
                heroStar.scale.setScalar(pulse);
                heroStar.userData.halo.scale.setScalar(1.05 + Math.sin(elapsed * 1.9) * 0.12);
                heroStar.userData.halo.material.opacity = 0.16 + Math.sin(elapsed * 2.1) * 0.055;
                heroStarLight.intensity = 2.0 + Math.sin(elapsed * 2.2) * 0.5;
            }

            for (const ribbon of garlandGroup.children) {
                ribbon.material.opacity = 0.48 + Math.sin(elapsed * 0.85 + ribbon.userData.phase) * 0.12;
            }

            for (const bulb of treeLightGroup.children) {
                const pulse = 0.72 + Math.sin(elapsed * 1.35 + bulb.userData.phase) * 0.28;
                bulb.scale.setScalar(bulb.userData.baseScale * pulse);
            }

            if (galaxyDust) {
                galaxyDust.rotation.y -= dt * 0.055;
                galaxyDust.rotation.x = Math.sin(elapsed * 0.12) * 0.045;
            }

            if (snowSystem) {
                const positions = snowSystem.geometry.attributes.position.array;
                const velocities = snowSystem.geometry.attributes.velocity.array;
                for (let i = 0; i < velocities.length; i++) {
                    positions[i * 3] += Math.sin(elapsed * 0.55 + i * 0.37) * 0.0025;
                    positions[i * 3 + 1] -= velocities[i];
                    if (positions[i * 3 + 1] < -22) {
                        positions[i * 3 + 1] = 42;
                        positions[i * 3] = (Math.random() - 0.5) * 112;
                        positions[i * 3 + 2] = (Math.random() - 0.5) * 112;
                    }
                }
                snowSystem.geometry.attributes.position.needsUpdate = true;
            }

            particleSystem.forEach((particle) => particle.update(dt));
            controls.update();
            composer.render();
        }

        init();
    </script>
</body>
</html>
